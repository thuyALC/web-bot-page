<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Workspace - Workspace Tối Ưu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #111827; 
      --bg-card: #1f2937; 
      --text-main: #f9fafb; 
      --text-muted: #94a3b8; 
      --border-color: rgba(255, 255, 255, 0.08); 
      --primary: #2563eb; 
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; padding: 32px 16px; display: flex; justify-content: center; min-height: 100vh;}
    main { width: 100%; max-width: 1024px; display: flex; flex-direction: column; gap: 24px; }

    .header-title { text-align: center; margin-bottom: 8px; }
    .header-title h1 { font-size: 28px; font-weight: 700; color: #ffffff; letter-spacing: -0.025em; }
    .header-title p { color: var(--text-muted); font-size: 15px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s; }
    .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    
    .card-header { display: flex; align-items: center; margin-bottom: 16px; gap: 8px; }
    .card-header h2 { font-size: 18px; font-weight: 600; color: #ffffff; }
    
    textarea, input[type="text"] { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #2c3e50; color: #ffffff; transition: all 0.2s; outline: none; margin-bottom: 12px; }
    textarea:focus, input[type="text"]:focus { border-color: var(--primary); background: #1f2937; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    textarea { min-height: 80px; resize: vertical; }

    .button-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; font-size: 14px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; }
    button:active { transform: scale(0.98); }
    
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; color: #e2e8f0; border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: #475569; }

    label.checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); cursor: pointer; user-select: none; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; display: none; }
    .badge.success { background: #059669; color: #ffffff; display: inline-flex; }
    .badge.error { background: #dc2626; color: #ffffff; display: inline-flex; }
    .badge.warning { background: #d97706; color: #ffffff; display: inline-flex; }

    pre.result-box { background: #111827; color: #e2e8f0; padding: 20px; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; min-height: 100px; margin: 0; border: 1px solid var(--border-color);}
    .output-box { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; background: rgba(0,0,0,0.2); border-left: 4px solid var(--primary); font-size: 14px; line-height: 1.7; white-space: pre-wrap; max-height: 400px; overflow-y: auto; border: 1px solid var(--border-color); }

    .riddle-display { font-size: 52px; text-align: center; padding: 28px 10px; margin-bottom: 16px; background: rgba(0,0,0,0.2); border-radius: 12px; letter-spacing: 6px; border: 1px dashed var(--border-color); line-height: 1.4; word-break: break-word; min-height: 100px; display: flex; align-items: center; justify-content: center; }
    
    .caro-wrapper { margin-top: 16px; max-width: 100%; max-height: 400px; overflow: auto; border: 1px solid var(--border-color); border-radius: 8px; background: #0f172a; }
    .caro-grid { display: grid; grid-template-columns: repeat(25, 36px); gap: 1px; background: #334155; width: max-content; padding: 1px; margin: 0 auto; }
    .caro-cell { width: 36px; height: 36px; background: #111827; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; cursor: pointer; user-select: none; transition: background 0.1s; }
    .caro-cell:hover { background: #1f2937; }
    .win-cell { background: #facc15 !important; color: #0f172a !important; }

    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="header-title">
      <h1>AI Workspace</h1>
      <p>Workspace Tối Ưu Hóa & Tích hợp Giải Trí</p>
    </div>

    <div class="grid">
      <div class="card" style="border-top: 3px solid #10b981;">
        <div class="card-header"><span style="font-size:18px;">💬</span><h2>Chat AI (Gemini + Hermes-Agent)</h2></div>
        <textarea id="message" placeholder="Hỏi tôi bất cứ điều gì..."></textarea>
        <div class="button-group">
          <button id="send" class="btn-primary" style="background: #10b981;">Gửi yêu cầu</button>
          <button id="clear" class="btn-secondary">Làm mới</button>
          <label class="checkbox-label"><input id="search" type="checkbox" checked> Chế độ Online</label>
        </div>
      </div>

      <div class="card" style="border-top: 3px solid #8b5cf6;">
        <div class="card-header"><span style="font-size:18px;">🎵</span><h2>Tìm Lời Bài Hát (Lyric)</h2></div>
        <input type="text" id="song-query" placeholder="Nhập tên bài hoặc 1 câu hát...">
        <div class="button-group">
          <button id="btn-lyric" class="btn-primary" style="background: #8b5cf6;">Tìm Lyric</button>
        </div>
        <div id="lyric-status" class="badge" style="margin-top: 12px; margin-bottom: 0;"></div>
        <div id="lyric-output" class="output-box" style="border-left-color: #8b5cf6;"></div>
      </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden; border: none; box-shadow: var(--shadow-md);">
      <div style="padding: 10px 20px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 15px; margin: 0; border:none; padding:0;">Kết quả truy vấn</h2>
        <div id="chat-status" class="badge"></div>
      </div>
      <pre id="result" class="result-box">Hệ thống sẵn sàng.</pre>
    </div>

    <div class="grid">
      <div class="card" style="border-top: 3px solid #f59e0b;">
        <div class="card-header"><span style="font-size:18px;">🧩</span><h2>Đuổi Hình Bắt Chữ (Local)</h2></div>
        <div id="game-display" class="riddle-display">❓❔❓</div>
        <div class="row" style="display:flex; gap:10px; margin-bottom:12px;">
          <input type="text" id="game-guess" placeholder="Đáp án của bạn..." style="margin-bottom: 0; flex: 1;">
          <button id="btn-guess" class="btn-primary" style="background: #f59e0b;">Đoán</button>
        </div>
        <div class="button-group">
          <button id="btn-new-riddle" class="btn-secondary" style="flex: 1;">Câu hỏi mới</button>
          <button id="btn-show-answer" class="btn-secondary" style="flex: 1; border-color: var(--danger); color: var(--danger);">Xem đáp án</button>
        </div>
        <div style="text-align: center; margin-top: 16px;">
            <div id="game-status" class="badge success" style="font-size:13px; padding: 4px 14px;">Sẵn sàng!</div>
        </div>
      </div>

      <div class="card" style="border-top: 3px solid #ef4444;">
        <div class="card-header" style="justify-content: space-between;">
            <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:18px;">⭕</span><h2>Cờ Caro (Bot Khó)</h2>
            </div>
            <div id="caro-status" class="badge success" style="margin: 0; font-size: 14px; padding: 4px 14px;">Bạn đi trước (X)</div>
        </div>
        <div class="button-group" style="justify-content: center;">
          <button id="btn-caro-reset" class="btn-secondary">Đầu hàng / Ván mới</button>
        </div>
        <div class="caro-wrapper">
            <div class="caro-grid" id="caro-board"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function apiCall(endpoint, payload) {
      const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lỗi máy chủ nội bộ.");
      return data;
    }
    
    function updateBadge(id, text, type) {
        const badge = document.getElementById(id);
        if(!badge) return;
        badge.textContent = text;
        badge.className = `badge ${type}`;
        badge.style.display = 'inline-flex';
    }

    // --- MODULE CHAT AI ---
    (() => {
        const sendBtn = document.getElementById("send");
        const clearBtn = document.getElementById("clear");
        const input = document.getElementById("message");
        const result = document.getElementById("result");
        
        if(sendBtn) sendBtn.onclick = async () => {
            const msg = input?.value.trim();
            if (!msg) return;
            updateBadge("chat-status", "⏳ Đang gọi AI...", "warning");
            result.textContent = "Hệ thống đang xử lý...";
            try {
                const search = document.getElementById("search")?.checked;
                const data = await apiCall("/api/chat", { message: msg, search });
                updateBadge("chat-status", data.search_status, data.is_error ? "error" : "success");
                result.textContent = data.reply;
            } catch (err) { 
                updateBadge("chat-status", "Mất kết nối", "error");
                result.textContent = "⚠️ " + err.message; 
            }
        };

        if(clearBtn) clearBtn.onclick = async () => {
            await apiCall("/api/clear", {});
            input.value = "";
            document.getElementById("chat-status").style.display = "none";
            result.textContent = "Phiên trò chuyện đã được làm mới.";
        };
    })();

    // --- MODULE TÃŒM LYRIC ---
    (() => {
        const searchBtn = document.getElementById("btn-lyric");
        const input = document.getElementById("song-query");
        const output = document.getElementById("lyric-output");
        
        if(searchBtn) searchBtn.onclick = async () => {
            const query = input?.value.trim();
            if (!query) { updateBadge("lyric-status", "Vui lòng nhập từ khóa.", "error"); return; }
            updateBadge("lyric-status", "Đang tra cứu...", "warning");
            output.style.display = "none";
            try {
                const data = await apiCall("/api/get_lyrics", { query });
                output.textContent = data.lyrics; 
                output.style.display = "block";
                updateBadge("lyric-status", "Hoàn tất", "success");
            } catch (err) { 
                updateBadge("lyric-status", err.message, "error");
            }
        };
    })();

    // --- MODULE ĐUỔI HÌNH BẮT CHỮ ---
    (() => {
        const riddleDisplay = document.getElementById("game-display");
        const guessInput = document.getElementById("game-guess");
        
        if(document.getElementById("btn-new-riddle")) document.getElementById("btn-new-riddle").onclick = async () => {
            if(riddleDisplay) riddleDisplay.textContent = "⏳";
            if(guessInput) guessInput.value = "";
            try {
                const data = await apiCall("/api/game/riddle", {});
                if(riddleDisplay) riddleDisplay.textContent = data.emoji;
                updateBadge("game-status", "Câu hỏi mới!", "success");
            } catch (err) { updateBadge("game-status", err.message, "error"); }
        };

        if(document.getElementById("btn-guess")) document.getElementById("btn-guess").onclick = async () => {
            const guess = guessInput?.value.trim();
            if (!guess) return;
            try {
                const data = await apiCall("/api/game/guess", { guess });
                updateBadge("game-status", data.message, data.correct ? "success" : "error");
            } catch (err) { updateBadge("game-status", err.message, "error"); }
        };

        if(document.getElementById("btn-show-answer")) document.getElementById("btn-show-answer").onclick = async () => {
            try {
                const data = await apiCall("/api/game/answer", {});
                updateBadge("game-status", data.message, "error");
                if(riddleDisplay) riddleDisplay.textContent = "🙈"; 
            } catch (err) { updateBadge("game-status", err.message, "error"); }
        };

        guessInput?.addEventListener("keypress", (e) => { 
            if (e.key === "Enter") document.getElementById("btn-guess")?.click(); 
        });
    })();

    // --- MODULE CỜ CARO (AI NÂNG CẤP) ---
    (() => {
        const SIZE = 25;
        let caroState = [];
        let caroActive = true;
        const boardEl = document.getElementById("caro-board");

        function initCaroState() { caroState = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); }

        function renderCaro() {
            if(!boardEl) return;
            boardEl.innerHTML = "";
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const div = document.createElement("div");
                    div.className = "caro-cell";
                    div.id = `cell-${r}-${c}`;
                    if (caroState[r][c] !== "") {
                        div.textContent = caroState[r][c];
                        div.style.color = caroState[r][c] === 'X' ? '#2563eb' : '#ef4444';
                    }
                    div.addEventListener('click', () => handleCaroClick(r, c));
                    boardEl.appendChild(div);
                }
            }
        }

        function updateSingleCell(r, c) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            if(cell) {
                cell.textContent = caroState[r][c];
                cell.style.color = caroState[r][c] === 'X' ? '#2563eb' : '#ef4444';
            }
        }

        function checkWin(r, c, p) {
            const dirs = [[1, 0],[0, 1],[1, 1],[1, -1]]; 
            for (let [dr, dc] of dirs) {
                let count = 1, cells = [[r, c]];
                let nr = r + dr, nc = c + dc;
                while(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && caroState[nr][nc]===p){ count++; cells.push([nr,nc]); nr+=dr; nc+=dc; }
                nr = r - dr; nc = c - dc;
                while(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && caroState[nr][nc]===p){ count++; cells.push([nr,nc]); nr-=dr; nc-=dc; }
                if(count >= 5) return cells;
            }
            return null;
        }

        function hasNeighbor(r, c) {
            for (let i = -2; i <= 2; i++) {
                for (let j = -2; j <= 2; j++) {
                    if (r+i >= 0 && r+i < SIZE && c+j >= 0 && c+j < SIZE && caroState[r+i][c+j] !== '') return true;
                }
            }
            return false;
        }

        // AI Nâng cấp: Đánh giá mảng liên tục, biết chặn 2 đầu, lấp lỗ hổng
        function getScore(r, c, player) {
            const opp = player === 'X' ? 'O' : 'X';
            let score = 0;
            const dirs = [[1,0], [0,1], [1,1], [1,-1]];
            
            for (let [dr, dc] of dirs) {
                let consecutive = 1;
                let blocks = 0;
                
                let i = 1;
                while(r + i*dr >= 0 && r + i*dr < SIZE && c + i*dc >= 0 && c + i*dc < SIZE && caroState[r + i*dr][c + i*dc] === player) {
                    consecutive++; i++;
                }
                if(r + i*dr < 0 || r + i*dr >= SIZE || c + i*dc < 0 || c + i*dc >= SIZE || caroState[r + i*dr][c + i*dc] === opp) blocks++;
                
                let j = 1;
                while(r - j*dr >= 0 && r - j*dr < SIZE && c - j*dc >= 0 && c - j*dc < SIZE && caroState[r - j*dr][c - j*dc] === player) {
                    consecutive++; j++;
                }
                if(r - j*dr < 0 || r - j*dr >= SIZE || c - j*dc < 0 || c - j*dc >= SIZE || caroState[r - j*dr][c - j*dc] === opp) blocks++;

                if(blocks === 2 && consecutive < 5) continue; // Khóa 2 đầu thì bỏ qua

                if(consecutive >= 5) score += 2000000;
                else if(consecutive === 4) score += (blocks === 0) ? 500000 : 100000;
                else if(consecutive === 3) score += (blocks === 0) ? 50000 : 10000;
                else if(consecutive === 2) score += (blocks === 0) ? 5000 : 500;
                else if(consecutive === 1) score += (blocks === 0) ? 50 : 5;
            }
            return score;
        }

        function botMove() {
            if(!caroActive) return;
            let bestScore = -1;
            let moves = [];
            
            if(caroState[12][12]==='') {
                moves = [{r: 12, c: 12}];
            } else {
                for(let r=0; r<SIZE; r++) {
                    for(let c=0; c<SIZE; c++) {
                        if(caroState[r][c]==='') {
                            if(!hasNeighbor(r,c)) continue;
                            
                            let attack = getScore(r, c, 'O');
                            let defense = getScore(r, c, 'X');
                            
                            // Phân bổ tư duy: Thủ chặt hơn một chút nhưng nếu win thì phải dứt điểm
                            let total = attack + defense * 1.2; 
                            
                            if(total > bestScore) {
                                bestScore = total;
                                moves = [{r, c}];
                            } else if (total === bestScore) {
                                moves.push({r, c}); // Thêm vào list nếu điểm bằng nhau để random chọn nước đi
                            }
                        }
                    }
                }
            }
            
            if(moves.length > 0) {
                let move = moves[Math.floor(Math.random() * moves.length)];
                caroState[move.r][move.c] = 'O';
                updateSingleCell(move.r, move.c);
                const win = checkWin(move.r, move.c, 'O');
                if(win) {
                    win.forEach(([wr,wc]) => document.getElementById(`cell-${wr}-${wc}`).classList.add("win-cell"));
                    updateBadge("caro-status", "Bot: Khóc đi cưng 😆", "error");
                    caroActive = false;
                } else updateBadge("caro-status", "Đến lượt bạn (X)", "success");
            }
        }

        function handleCaroClick(r, c) {
            if(caroState[r][c] !== '' || !caroActive) return;
            caroState[r][c] = 'X';
            updateSingleCell(r, c);
            const win = checkWin(r, c, 'X');
            if(win) {
                win.forEach(([wr,wc]) => document.getElementById(`cell-${wr}-${wc}`).classList.add("win-cell"));
                updateBadge("caro-status", "Bạn thắng rồi! Đỉnh 🎉", "success");
                caroActive = false;
            } else {
                updateBadge("caro-status", "Bot đang tính nước cờ...", "warning");
                setTimeout(botMove, 80); 
            }
        }

        if(document.getElementById("btn-caro-reset")) document.getElementById("btn-caro-reset").onclick = () => {
            initCaroState(); caroActive = true;
            updateBadge("caro-status", "Bạn đi trước (X)", "success");
            renderCaro();
            const wrapper = document.querySelector('.caro-wrapper');
            if(wrapper) {
                wrapper.scrollLeft = wrapper.scrollWidth / 2 - wrapper.clientWidth / 2;
                wrapper.scrollTop = wrapper.scrollHeight / 2 - wrapper.clientHeight / 2;
            }
        };

        initCaroState(); renderCaro();
    })();
  </script>
</body>
</html>
