<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trợ lý AI - Kể truyện ma</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
    .panel { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    textarea, input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    button { padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    #story-output { white-space: pre-wrap; padding: 15px; background: #0f3460; border-left: 5px solid #e94560; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>💬 Chat với AI</h1>
    <textarea id="message" placeholder="Nhập câu hỏi..."></textarea>
    <button id="send">Gửi</button>
    <button id="clear">Xóa trí nhớ</button>
  </div>
  
  <div class="panel">
    <h2>👻 Kể Truyện Ma</h2>
    <input id="story-topic" placeholder="Ví dụ: Làng quê, bệnh viện, chung cư...">
    <button id="create-story">Bắt đầu kể</button>
    <div id="story-output">Kết quả sẽ hiện ở đây...</div>
  </div>

  <script>
    document.querySelector("#send").onclick = async () => {
      const res = await fetch("/api/chat", { method: "POST", body: JSON.stringify({message: document.querySelector("#message").value}), headers: {"Content-Type": "application/json"} });
      const data = await res.json();
      alert(data.reply);
    };
    
    document.querySelector("#create-story").onclick = async () => {
      const topic = document.querySelector("#story-topic").value;
      document.querySelector("#story-output").textContent = "Đang triệu hồi linh hồn... đợi tí nhé...";
      const res = await fetch("/api/ghost_story", { method: "POST", body: JSON.stringify({topic}), headers: {"Content-Type": "application/json"} });
      const data = await res.json();
      document.querySelector("#story-output").textContent = data.story || data.error;
    };

    document.querySelector("#clear").onclick = async () => {
      await fetch("/api/clear", { method: "POST" });
      alert("Đã xóa!");
    };
  </script>
</body>
</html>
