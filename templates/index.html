<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Workspace Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f3f4f6;
      --bg-card: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    
    body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; padding: 32px 16px; display: flex; justify-content: center; }
    
    main { width: 100%; max-width: 1024px; display: flex; flex-direction: column; gap: 24px; }

    .header-title { text-align: center; margin-bottom: 8px; }
    .header-title h1 { font-size: 28px; font-weight: 700; color: #111827; letter-spacing: -0.025em; }
    .header-title p { color: var(--text-muted); font-size: 15px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; }

    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); transition: box-shadow 0.2s; }
    .card:hover { box-shadow: var(--shadow-md); }
    
    .card-header { display: flex; align-items: center; margin-bottom: 16px; gap: 8px; }
    .card-header h2 { font-size: 18px; font-weight: 600; color: var(--text-main); }
    
    .form-group { margin-bottom: 16px; }
    textarea, input[type="text"] { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; background: #f9fafb; color: var(--text-main); transition: all 0.2s; outline: none; }
    textarea:focus, input[type="text"]:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    textarea { min-height: 100px; resize: vertical; }

    .button-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; font-size: 14px; font-weight: 500; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; }
    button:active { transform: scale(0.98); }
    
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #059669; }
    .btn-purple { background: var(--purple); color: white; }
    .btn-purple:hover { background: #7c3aed; }

    label.checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); cursor: pointer; user-select: none; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 500; margin-bottom: 12px; display: none; }
    .badge.success { background: #d1fae5; color: #065f46; display: inline-flex; }
    .badge.error { background: #fee2e2; color: #991b1b; display: inline-flex; }
    .badge.warning { background: #fef3c7; color: #92400e; display: inline-flex; }

    pre.result-box { background: #1f2937; color: #f9fafb; padding: 20px; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; min-height: 120px; }
    
    .output-box { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; background: #f8fafc; border-left: 4px solid var(--primary); font-size: 15px; line-height: 1.7; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }

    /* Game Styling */
    .riddle-display { font-size: 48px; text-align: center; padding: 32px 20px; margin-bottom: 16px; background: #f3f4f6; border-radius: 12px; letter-spacing: 8px; border: 1px dashed var(--border-color); }
    
    .caro-wrapper { margin-top: 16px; max-width: 100%; max-height: 400px; overflow: auto; border: 1px solid var(--border-color); border-radius: 8px; background: #f9fafb; }
    .caro-grid { display: grid; grid-template-columns: repeat(25, 36px); gap: 1px; background: #d1d5db; width: max-content; padding: 1px; margin: 0 auto; }
    .caro-cell { width: 36px; height: 36px; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; cursor: pointer; user-select: none; transition: background 0.1s; }
    .caro-cell:hover { background: #f3f4f6; }
    .caro-cell.win-cell { background: #fef08a !important; color: #92400e !important; }

    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="header-title">
      <h1>AI Workspace</h1>
      <p>Công cụ Tích hợp Thông minh & Tiện ích Mở rộng</p>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-header">
          <span>💬</span><h2>Trợ lý Trí tuệ Nhân tạo</h2>
        </div>
        <div class="form-group">
          <textarea id="message" placeholder="Bạn cần hỗ trợ điều gì hôm nay?"></textarea>
        </div>
        <div class="button-group">
          <button id="send" class="btn-primary">Gửi yêu cầu</button>
          <button id="clear" class="btn-secondary">Làm mới</button>
          <label class="checkbox-label"><input id="search" type="checkbox" checked> Chế độ Online</label>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span>🎵</span><h2>Tra cứu Lời Bài Hát</h2>
        </div>
        <div class="form-group">
          <input type="text" id="song-query" placeholder="Nhập tên bài hoặc trích đoạn lời bài hát...">
        </div>
        <div class="button-group">
          <button id="btn-lyric" class="btn-primary" style="background: var(--purple);">Tìm kiếm</button>
        </div>
        <div id="lyric-status" class="badge" style="margin-top: 12px; margin-bottom: 0;"></div>
        <div id="lyric-output" class="output-box" style="border-left-color: var(--purple);"></div>
      </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden; border: none; box-shadow: var(--shadow-md);">
      <div style="padding: 16px 24px; border-bottom: 1px solid var(--border-color); background: #ffffff; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 16px; margin: 0;">Kết quả truy vấn</h2>
        <div id="chat-status" class="badge"></div>
      </div>
      <pre id="result" class="result-box">Hệ thống sẵn sàng tiếp nhận lệnh.</pre>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-header">
          <span>📖</span><h2>Sáng tác Truyện Ma</h2>
        </div>
        <div class="form-group">
          <input type="text" id="story-topic" placeholder="Chủ đề (VD: Bệnh viện bỏ hoang, chuyến xe đêm...)">
        </div>
        <div class="button-group">
          <button id="create-story" class="btn-primary" style="background: var(--success);">Bắt đầu sáng tác</button>
        </div>
        <div id="story-status" class="badge" style="margin-top: 12px; margin-bottom: 0;"></div>
        <div id="story-output" class="output-box" style="border-left-color: var(--success);"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span>🧩</span><h2>Minigame: Đuổi Hình Bắt Chữ</h2>
        </div>
        <div id="game-display" class="riddle-display">❓❔❓</div>
        <div class="form-group" style="display: flex; gap: 8px;">
          <input type="text" id="game-guess" placeholder="Nhập đáp án..." style="margin-bottom: 0;">
          <button id="btn-guess" class="btn-primary">Đoán</button>
        </div>
        <div class="button-group" style="margin-top: 12px;">
          <button id="btn-new-riddle" class="btn-secondary" style="flex: 1;">Câu hỏi mới</button>
          <button id="btn-show-answer" class="btn-secondary" style="flex: 1; color: var(--danger);">Xem đáp án</button>
        </div>
        <div style="text-align: center; margin-top: 16px;">
            <div id="game-status" class="badge">Sẵn sàng!</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span>⭕</span><h2>Cờ Caro (Luật 5 nước)</h2>
        </div>
        <div id="caro-status" class="badge success" style="margin: 0; font-size: 14px;">Bạn đi trước (X)</div>
      </div>
      <div class="button-group" style="justify-content: center;">
        <button id="btn-caro-reset" class="btn-secondary">Khởi tạo ván mới</button>
      </div>
      <div class="caro-wrapper">
          <div class="caro-grid" id="caro-board"></div>
      </div>
    </div>

  </main>

  <script>
    const getEl = (id) => document.querySelector(id);
    const addClick = (id, handler) => { 
        const el = getEl(id); 
        if (el) el.addEventListener("click", handler); 
    };
    
    function updateBadge(id, text, type) {
        const badge = getEl(id);
        if(!badge) return;
        badge.textContent = text;
        badge.className = `badge ${type}`;
        badge.style.display = 'inline-flex';
    }

    async function postJson(url, data) {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Lỗi máy chủ nội bộ.");
      return json;
    }

    // --- CHAT AI ---
    addClick("#send", async () => {
      const message = getEl("#message")?.value.trim();
      const search = getEl("#search")?.checked;
      const resultBox = getEl("#result");
      
      if (!message) return;
      
      updateBadge("#chat-status", "⏳ Đang xử lý...", "warning");
      resultBox.textContent = "Hệ thống đang phân tích yêu cầu...";
      
      try {
        const data = await postJson("/api/chat", { message, search });
        updateBadge("#chat-status", data.search_status, data.search_status.includes("Lỗi") ? "error" : "success");
        resultBox.textContent = data.reply;
      } catch (err) { 
        updateBadge("#chat-status", "Mất kết nối", "error");
        resultBox.textContent = err.message; 
      }
    });

    addClick("#clear", async () => {
      await postJson("/api/clear", {});
      if(getEl("#message")) getEl("#message").value = "";
      if(getEl("#chat-status")) getEl("#chat-status").style.display = "none";
      if(getEl("#result")) getEl("#result").textContent = "Phiên làm việc đã được làm mới.";
    });

    // --- TÌM LỜI BÀI HÁT ---
    addClick("#btn-lyric", async () => {
      const query = getEl("#song-query")?.value.trim();
      const output = getEl("#lyric-output");
      if (!query) { updateBadge("#lyric-status", "Vui lòng nhập từ khóa.", "error"); return; }
      
      updateBadge("#lyric-status", "Đang truy xuất dữ liệu...", "warning");
      output.style.display = "none";
      
      try {
        const data = await postJson("/api/get_lyrics", { query });
        output.textContent = data.lyrics; 
        output.style.display = "block";
        updateBadge("#lyric-status", "Truy xuất thành công", "success");
      } catch (err) { 
        updateBadge("#lyric-status", "Lỗi: " + err.message, "error");
      }
    });

    // --- TRUYỆN MA ---
    addClick("#create-story", async () => {
      const topic = getEl("#story-topic")?.value.trim() || "ngẫu nhiên";
      const output = getEl("#story-output");
      output.style.display = "block";
      output.textContent = "Hệ thống đang khởi tạo nội dung...";
      updateBadge("#story-status", "Đang xử lý...", "warning");
      
      try {
        const data = await postJson("/api/ghost_story", { topic });
        output.textContent = data.story || data.error;
        updateBadge("#story-status", "Hoàn tất", "success");
      } catch (err) { 
        output.textContent = "Lỗi xử lý: " + err.message; 
        updateBadge("#story-status", "Thất bại", "error");
      }
    });

    // --- ĐUỔI HÌNH BẮT CHỮ ---
    const gameDisplay = getEl("#game-display");
    const gameGuess = getEl("#game-guess");

    addClick("#btn-new-riddle", async () => {
      if(gameDisplay) gameDisplay.textContent = "⏳";
      if(gameGuess) gameGuess.value = "";
      try {
        const data = await postJson("/api/game/riddle", {});
        if(gameDisplay) gameDisplay.textContent = data.emoji;
        updateBadge("#game-status", "Câu hỏi đã sẵn sàng", "warning");
      } catch (err) { 
        updateBadge("#game-status", err.message, "error");
      }
    });

    addClick("#btn-guess", async () => {
      const guess = gameGuess?.value.trim();
      if (!guess) return;
      try {
        const data = await postJson("/api/game/guess", { guess });
        updateBadge("#game-status", data.message, data.correct ? "success" : "error");
      } catch (err) { 
        updateBadge("#game-status", err.message, "error");
      }
    });

    addClick("#btn-show-answer", async () => {
      try {
        const data = await postJson("/api/game/answer", {});
        updateBadge("#game-status", data.message, "error");
        if(gameDisplay) gameDisplay.textContent = "🙈"; 
      } catch (err) { 
        updateBadge("#game-status", err.message, "error");
      }
    });

    if(gameGuess) {
      gameGuess.addEventListener("keypress", (e) => { 
        if (e.key === "Enter") getEl("#btn-guess")?.click(); 
      });
    }

    // --- CỜ CARO ---
    const BOARD_SIZE = 25;
    const caroBoard = getEl('#caro-board');
    let caroState = [];
    let caroActive = true;

    function initCaroState() { caroState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill('')); }

    function renderCaro() {
      if(!caroBoard) return;
      caroBoard.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
              const div = document.createElement('div');
              div.className = 'caro-cell';
              div.id = `cell-${r}-${c}`;
              if (caroState[r][c] !== '') {
                  div.style.color = caroState[r][c] === 'X' ? 'var(--primary)' : 'var(--danger)';
                  div.textContent = caroState[r][c];
              }
              div.addEventListener('click', () => handleCaroClick(r, c));
              caroBoard.appendChild(div);
          }
      }
    }

    function updateSingleCell(r, c) {
        const cell = getEl(`#cell-${r}-${c}`);
        if(cell) {
            cell.style.
