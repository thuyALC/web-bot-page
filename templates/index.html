<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trợ lý Web AI Đa Năng</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .caro-grid { display: grid; grid-template-columns: repeat(20, 25px); width: max-content; }
    .cell { width: 25px; height: 25px; border: 1px solid #ccc; cursor: pointer; text-align: center; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="panel">
        <h1>Chat & Truyện</h1>
        <textarea id="msg" style="width:100%; height:100px;"></textarea>
        <button id="send">Chat</button>
        <hr>
        <input id="topic" placeholder="Chủ đề truyện ma...">
        <button id="btn-story">Kể truyện</button>
        <div id="story" style="white-space:pre-wrap; margin-top:10px;"></div>
    </div>
    <div class="panel">
        <h1>Game Caro (Local)</h1>
        <div id="caro" class="caro-grid"></div>
    </div>
  </div>

  <script>
    // Chat AI
    document.querySelector("#send").onclick = async () => {
        const res = await fetch("/api/chat", {method: "POST", body: JSON.stringify({message: document.querySelector("#msg").value, search: true}), headers: {"Content-Type": "application/json"}});
        alert((await res.json()).reply);
    };
    
    // Truyện ma
    document.querySelector("#btn-story").onclick = async () => {
        const res = await fetch("/api/ghost_story", {method: "POST", body: JSON.stringify({topic: document.querySelector("#topic").value}), headers: {"Content-Type": "application/json"}});
        document.querySelector("#story").textContent = (await res.json()).story;
    };

    // Caro tại trình duyệt
    const board = document.getElementById('caro');
    for(let i=0; i<400; i++) {
        const div = document.createElement('div'); div.className = 'cell';
        div.onclick = function() { this.textContent = 'X'; };
        board.appendChild(div);
    }
  </script>
</body>
</html>
