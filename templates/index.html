<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trợ lý Web AI</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .panel { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .caro-grid { display: grid; grid-template-columns: repeat(20, 25px); width: max-content; }
    .cell { width: 25px; height: 25px; border: 1px solid #ccc; cursor: pointer; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Chat AI</h1>
    <textarea id="msg"></textarea>
    <button id="send">Gửi</button>
  </div>
  
  <div class="panel">
    <h2>Game Đuổi Hình</h2>
    <div id="emoji" style="font-size: 40px;">❓</div>
    <input id="guess" placeholder="Đáp án...">
    <button id="btn-guess">Đoán</button>
    <button id="btn-riddle">Lấy câu đố</button>
  </div>

  <div class="panel">
    <h2>Cờ Caro</h2>
    <div id="caro" class="caro-grid"></div>
    <button onclick="location.reload()">Chơi ván mới</button>
  </div>

  <script>
    // Logic Chat
    document.querySelector("#send").onclick = async () => {
        const res = await fetch("/api/chat", {method: "POST", body: JSON.stringify({message: document.querySelector("#msg").value}), headers: {"Content-Type": "application/json"}});
        alert((await res.json()).reply);
    };

    // Logic Caro (Chạy hoàn toàn tại trình duyệt)
    const board = document.getElementById('caro');
    for(let i=0; i<400; i++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.onclick = function() { 
            this.textContent = 'X'; 
            // Bot đánh vào ô trống đầu tiên
            setTimeout(() => {
                const empty = Array.from(document.querySelectorAll('.cell')).find(c => !c.textContent);
                if(empty) empty.textContent = 'O';
            }, 300);
        };
        board.appendChild(div);
    }
  </script>
</body>
</html>
