<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý Web AI</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .panel { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    textarea, input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 20px; background: #146c5c; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    pre { background: #1a1a2e; color: #fff; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Trợ lý Web AI</h1>
    <textarea id="message" placeholder="Nhập câu hỏi..."></textarea>
    <button id="send">Gửi</button>
    <button id="clear">Xóa trí nhớ</button>
  </div>
  <div class="panel">
    <h2>👻 Kể Truyện Ma</h2>
    <input id="story-topic" placeholder="Chủ đề truyện...">
    <button id="create-story">Bắt đầu kể</button>
    <div id="story-output" style="margin-top:15px; padding:10px; border-left:4px solid #c0392b;"></div>
  </div>
  <pre id="result">Sẵn sàng.</pre>
  <script>
    document.querySelector("#send").onclick = async () => {
      const res = await fetch("/api/chat", { method: "POST", body: JSON.stringify({message: document.querySelector("#message").value, search: true}), headers: {"Content-Type": "application/json"} });
      const data = await res.json();
      document.querySelector("#result").textContent = data.reply;
    };
    document.querySelector("#create-story").onclick = async () => {
      const topic = document.querySelector("#story-topic").value;
      const res = await fetch("/api/ghost_story", { method: "POST", body: JSON.stringify({topic}), headers: {"Content-Type": "application/json"} });
      const data = await res.json();
      document.querySelector("#story-output").textContent = data.story;
    };
    document.querySelector("#clear").onclick = () => fetch("/api/clear", { method: "POST" }).then(() => location.reload());
  </script>
</body>
</html>
